name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unpack project payload
        run: python -m zipfile -e ski_adventure_android_payload.zip .

      - name: Generate PNG assets
        run: |
          python -m pip install pillow
          python make_assets.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake autoconf-archive libtool libtool-bin gettext m4 pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache curl

      - name: Install Android SDK into Buildozer path
        run: |
          set -e
          BSDK="$HOME/.buildozer/android/platform/android-sdk"
          rm -rf "$BSDK"
          mkdir -p "$BSDK/cmdline-tools"
          cd /tmp
          curl -fL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$BSDK/cmdline-tools"
          mv "$BSDK/cmdline-tools/cmdline-tools" "$BSDK/cmdline-tools/latest"
          ln -sfn cmdline-tools/latest "$BSDK/tools"
          export ANDROID_HOME="$BSDK"
          export ANDROID_SDK_ROOT="$BSDK"
          echo "ANDROID_HOME=$BSDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$BSDK" >> "$GITHUB_ENV"
          ( yes | "$BSDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BSDK" --licenses >/dev/null ) || true
          "$BSDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$BSDK" "platform-tools" "platforms;android-33" "build-tools;33.0.2" "build-tools;37.0.0"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Publish build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add buildozer.log || true
          git commit -m 'buildozer log [skip ci]' || true
          git push --force origin HEAD:build-logs || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ski-adventure-debug-apk
          path: bin/*.apk
          if-no-files-found: error
