name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Unpack project payload
        run: python -m zipfile -e ski_adventure_android_payload.zip .

      - name: Generate PNG assets
        run: |
          python -m pip install pillow
          python make_assets.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache curl

      - name: Cache Buildozer Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-
            buildozer-

      - name: Copy accepted Android SDK licenses for Buildozer
        run: |
          BSDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BSDK/licenses"
          cp -r "$ANDROID_HOME/licenses/." "$BSDK/licenses/" || true
          ls -la "$BSDK/licenses" || true

      - name: Seed Android SHK license hashes for Buildozer
        run: |
          BSDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$BSDK/licenses"
          for f in android-sdk-license android-sdk-preview-license; do
            for h in 176a1732211ab645d20e24b25dcc06df2d71014a 24333f8a63b6825ea9c5514f83c2829b004d1fee 1bffa7a055c1ad736a1f2d6efae2706651da8cf0 2230031030640aa692bf90f973a739f52f60d044 4e2493b6a4ccddc488efbf33f56ce1b1d96353c1; do
              echo "$h" >> "$BSDK/licenses/$f"
            done
            sort -u "$BSDK/licenses/$f" -o "$BSDK/licenses/$f" || true
          done
          cat "$BSDK/licenses/android-sdk-license" || true

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Build debug APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Publish build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add buildozer.log || true
          git commit -m 'buildozer log [skip ci]' || true
          git push --force origin HEAD:build-logs || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ski-adventure-debug-apk
          path: bin/*.apk
          if-no-files-found: error
